# Example nginx config with HTTP/2 disabled (the stopgap mitigation).
# Try:
#   python3 nginx_http2_check.py --version 1.31.8 --config examples/nginx-http2-off.conf
# -> NOT_AFFECTED (exit 0), even though 1.31.8 is an affected version.
events {
    worker_connections 1024;
}

http {
    # nginx 1.25.1+ syntax; also remove `http2` from every listen line.
    http2 off;

    server {
        listen 443 ssl;
        server_name example.com;
        root /var/www/html;
    }
}
