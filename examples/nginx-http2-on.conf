# Example nginx config with HTTP/2 enabled (vulnerable setup when the
# version is in an affected range). Try:
#   python3 nginx_http2_check.py --version 1.31.8 --config examples/nginx-http2-on.conf
events {
    worker_connections 1024;
}

http {
    server {
        listen 443 ssl http2;
        server_name example.com;

        # CVE-2026-123633 needs a proxy path; CVE-2026-123007 does not —
        # it fires on plain static files too.
        location / {
            proxy_pass http://127.0.0.1:8080;
        }
    }
}
