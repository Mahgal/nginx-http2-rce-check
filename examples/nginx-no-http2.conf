# Example nginx config with no HTTP/2 directive at all (HTTP/2 was
# never turned on — not a default). Try:
#   python3 nginx_http2_check.py --version 1.31.8 --config examples/nginx-no-http2.conf
# -> UNKNOWN (exit 3): the version is affected, but the tool cannot
# prove from this file alone that no other config enables HTTP/2.
# Point --config at your real nginx.conf / conf.d directory.
events {
    worker_connections 1024;
}

http {
    server {
        listen 80;
        server_name example.com;
        root /var/www/html;
    }
}
